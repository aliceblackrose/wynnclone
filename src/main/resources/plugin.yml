name: WynnClone
version: '${version}'
main: io.github.aliceblackrose.wynnclone.WynnClonePlugin
api-version: '26.2'
author: aliceblackrose
description: Combat-focused action RPG prototype
commands:
  combat:
    description: WynnClone combat debug command
    usage: /combat <mana|combo|cast>
    permission: wynnclone.combat.debug
permissions:
  wynnclone.combat.debug:
    default: op
